
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "arrsac"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.0.0"
napi-derive = "3.0.0"
arrsac = "0.11"
sample-consensus = "1.0"
rand_xoshiro = "0.7"   # uses rand_core 0.9 (matches arrsac)
rand_core = "0.9"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
